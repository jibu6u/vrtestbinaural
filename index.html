<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>VR Stereo: Lift + Color Rivalry + Mono Vision (≤5 Hz)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: dark; }
    html, body { margin:0; padding:0; height:100%; background:#000; font-family: system-ui, -apple-system, Segoe UI, Roboto, Noto Sans, Helvetica, Arial; }
    #ui {
      position: fixed; inset: 12px auto auto 12px; z-index: 10;
      background: rgba(20,20,20,0.8); border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(6px); color:#fff; padding:12px; border-radius:12px; width: 360px;
    }
    #ui h2 { margin: 0 0 8px; font-size: 16px; font-weight: 700; }
    .row { display:flex; align-items:center; gap:8px; margin:6px 0; }
    label { font-size: 13px; white-space: nowrap; }
    input[type="range"] { width: 170px; }
    input[type="color"] { width: 28px; height: 28px; padding:0; border:none; background: none; }
    select, button { font-size: 13px; }
    #hint { position: fixed; right:12px; bottom:12px; color:#9aa4ad; font-size:12px; opacity:0.9; }
    canvas { display:block; width:100vw; height:100vh; }
    .small { font-size:12px; color:#b8c0c7; }
    hr { border: none; border-top: 1px solid rgba(255,255,255,0.12); margin: 8px 0; }
  </style>
</head>
<body>
  <div id="ui">
    <h2>VR 좌/우 밝기 · 색상 라이벌리 · Mono Vision</h2>

    <div class="row">
      <label>좌안 밝기(Lift):</label>
      <input id="leftLift" type="range" min="0.20" max="2.00" step="0.01" value="1.00">
      <span id="leftLiftVal" class="small">1.00</span>
    </div>
    <div class="row">
      <label>우안 밝기(Lift):</label>
      <input id="rightLift" type="range" min="0.20" max="2.00" step="0.01" value="1.00">
      <span id="rightLiftVal" class="small">1.00</span>
    </div>

    <hr />

    <div class="row">
      <label>좌안 색상 A:</label><input id="leftColorA" type="color" value="#ff0000">
      <label>B:</label><input id="leftColorB" type="color" value="#0000ff">
    </div>
    <div class="row">
      <label>우안 색상 A:</label><input id="rightColorA" type="color" value="#ffff00">
      <label>B:</label><input id="rightColorB" type="color" value="#00ff00">
    </div>

    <div class="row">
      <label>전환 주파수(Hz):</label>
      <input id="freq" type="range" min="0.0" max="5.0" step="0.1" value="2.0">
      <span id="freqVal" class="small">2.0 Hz</span>
    </div>
    <div class="row">
      <label>파형:</label>
      <select id="wave">
        <option value="square" selected>Square (뚜렷한 교대)</option>
        <option value="sine">Sine (부드러운 보간)</option>
      </select>
    </div>

    <hr />

    <div class="row">
      <label>Mono Vision 모드:</label>
      <select id="monoMode">
        <option value="normal" selected>Normal (좌/우 분리)</option>
        <option value="leftOnly">좌안만 보기 (복제)</option>
        <option value="rightOnly">우안만 보기 (복제)</option>
      </select>
    </div>

    <div class="small" style="margin-top:6px; line-height:1.3;">
      • 비VR에서는 대략적인 <b>평균 색/밝기</b>가 보입니다.<br/>
      • VR 모드에서 각 눈에 <b>서로 다른 색/밝기</b>가 적용됩니다.<br/>
      • 안전을 위해 전환 주파수는 최대 5 Hz로 제한했습니다.
    </div>
  </div>

  <div id="hint">브라우저의 Enter VR 버튼을 눌러 VR 모드로 들어가세요.</div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
    import { VRButton } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/VRButton.js';

    const $ = (id) => document.getElementById(id);
    const clamp01 = (x) => Math.min(1, Math.max(0, x));
    const hexToColor = (hex) => new THREE.Color(hex);
    const lerpColors = (c1, c2, t) => new THREE.Color().copy(c1).lerp(c2, clamp01(t));
    const squareWave01 = (s) => (s >= 0 ? 1 : 0);

    // UI Elements
    const leftLiftEl  = $("leftLift");
    const rightLiftEl = $("rightLift");
    const leftLiftVal = $("leftLiftVal");
    const rightLiftVal= $("rightLiftVal");
    const freqEl      = $("freq");
    const freqVal     = $("freqVal");
    const waveEl      = $("wave");
    const monoModeEl  = $("monoMode");
    const leftColorAEl = $("leftColorA");
    const leftColorBEl = $("leftColorB");
    const rightColorAEl= $("rightColorA");
    const rightColorBEl= $("rightColorB");

    leftLiftEl.addEventListener('input', ()=> leftLiftVal.textContent = (+leftLiftEl.value).toFixed(2));
    rightLiftEl.addEventListener('input',()=> rightLiftVal.textContent= (+rightLiftEl.value).toFixed(2));
    freqEl.addEventListener('input', ()=> freqVal.textContent = `${(+freqEl.value).toFixed(1)} Hz`);

    // Scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.6, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);
    document.body.appendChild(VRButton.createButton(renderer));

    // Lights
    const hemi = new THREE.HemisphereLight(0xffffff, 0x222233, 0.6); scene.add(hemi);
    const dir  = new THREE.DirectionalLight(0xffffff, 1.0); dir.position.set(3,4,2); scene.add(dir);

    // Objects
    const group = new THREE.Group(); scene.add(group);
    const geo = new THREE.BoxGeometry(0.4,0.4,0.4);
    for (let i=0;i<24;i++){
      const cube = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0xffffff }));
      resetCube(cube, true);
      group.add(cube);
    }

    function resetCube(cube, randomZ=false){
      cube.position.set((Math.random()-0.5)*2.5, (Math.random()-0.5)*1.5 + 1.3, randomZ? (Math.random()*-8-2) : -8);
      cube.userData.speed = 0.015 + Math.random()*0.02;
      cube.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
    }

    function computeEyeColor(now, isLeftEye){
      const f = Math.min(5.0, Math.max(0, parseFloat(freqEl.value)||0));
      const t = now * f * Math.PI * 2.0;
      const wave = waveEl.value;
      const la = hexToColor(leftColorAEl.value);
      const lb = hexToColor(leftColorBEl.value);
      const ra = hexToColor(rightColorAEl.value);
      const rb = hexToColor(rightColorBEl.value);
      const s = Math.sin(t);
      const mix = (wave === 'square') ? squareWave01(s) : (s*0.5 + 0.5);
      return isLeftEye ? lerpColors(la, lb, mix) : lerpColors(ra, rb, mix);
    }

    group.traverse(obj => {
      if (!obj.isMesh) return;
      obj.onBeforeRender = (renderer, scn, cam, geo, mat) => {
        const xrCam = renderer.xr.getCamera();
        const now = performance.now()/1000;
        if (xrCam && xrCam.isArrayCamera && xrCam.cameras.length >= 2) {
          const isLeftEye = (cam === xrCam.cameras[0]);
          const mode = monoModeEl.value;
          let colL = computeEyeColor(now,true);
          let colR = computeEyeColor(now,false);
          let liftL = parseFloat(leftLiftEl.value);
          let liftR = parseFloat(rightLiftEl.value);
          if(mode==="leftOnly"){ colR=colL; liftR=liftL; }
          else if(mode==="rightOnly"){ colL=colR; liftL=liftR; }
          const col = isLeftEye ? colL : colR;
          const lift = isLeftEye ? liftL : liftR;
          mat.color.setRGB(clamp01(col.r*lift), clamp01(col.g*lift), clamp01(col.b*lift));
        } else {
          // Non-VR preview (average)
          const colL = computeEyeColor(now,true);
          const colR = computeEyeColor(now,false);
          const liftL = parseFloat(leftLiftEl.value);
          const liftR = parseFloat(rightLiftEl.value);
          mat.color.setRGB(
            clamp01((colL.r*liftL + colR.r*liftR)/2),
            clamp01((colL.g*liftL + colR.g*liftR)/2),
            clamp01((colL.b*liftL + colR.b*liftR)/2)
          );
        }
      };
    });

    renderer.setAnimationLoop(() => {
      group.children.forEach(c => {
        c.rotation.x += 0.01;
        c.rotation.y += 0.012;
        c.position.z += c.userData.speed;
        if(c.position.z>1) resetCube(c);
      });
      renderer.render(scene, camera);
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
